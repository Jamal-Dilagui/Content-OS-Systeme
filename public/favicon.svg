<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background with gradient -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Checklist with 3 items, 2 checked -->
  <!-- Item 1: checked -->
  <path d="M 14 22 L 19 27 L 28 17" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="32" y="18" width="18" height="4" rx="2" fill="white" opacity="0.9"/>
  <!-- Item 2: checked -->
  <path d="M 14 38 L 19 43 L 28 33" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="32" y="34" width="18" height="4" rx="2" fill="white" opacity="0.9"/>
  <!-- Item 3: unchecked (empty circle) -->
  <circle cx="21" cy="51" r="5.5" stroke="white" stroke-width="2.5" fill="none" opacity="0.6"/>
  <rect x="32" y="48" width="18" height="4" rx="2" fill="white" opacity="0.5"/>
</svg>
